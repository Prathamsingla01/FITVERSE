<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitVerse - Authentication</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="scroll-progress-bar" id="scrollProgressBar"></div>
    <nav class="navbar minimalist-nav">
        <div class="container nav-container">
            <div class="nav-wrapper nav-wrapper-flex">
                <div class="nav-left nav-left-flex">
                    <button class="menu-toggle-btn reset-margin" id="desktopMenuBtn">
                        <span class="hamburger-icon" aria-hidden="true">
                            <span></span><span></span><span></span>
                        </span>
                    </button>
                    <div class="logo">
                        <a href="index.html" class="brand-link">
                            <img src="logo.svg" alt="FitVerse" class="brand-logo">
                            <span class="brand-name">FITVERSE</span>
                        </a>
                    </div>
                </div>
                <div class="nav-actions">
                    <button id="themeToggleBtn" class="action-icon action-icon-theme" title="Toggle Theme">☀️</button>
                </div>
            </div>
        </div>
    </nav>
    <div class="fullscreen-menu" id="fullscreenMenu">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <div class="sleek-sidebar">
            <div class="sidebar-header">
                <button class="close-menu-btn" id="closeMenuBtn">✕</button>
            </div>
            <div class="sidebar-content">
                <ul class="sleek-nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="workouts.html">Workouts</a></li>
                    <li><a href="diet.html">Diet Plan</a></li>
                    <li><a href="supplements.html">Supplements</a></li>
                    <li><a href="shop.html">Store</a></li>
                </ul>
            </div>
        </div>
    </div>
    <section class="auth-section">
        <div class="container auth-container">
            <div class="auth-box">
                <h2>Join FitVerse Elite</h2>
                <form id="signupForm" class="auth-form" onsubmit="event.preventDefault(); window.location.href='index.html';">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required placeholder="Create a password">
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Weak</span>
                    </div>
                    <button type="submit" class="btn btn-primary auth-submit">Sign Up</button>
                </form>
            </div>
        </div>
    </section>
    <script src="main.js"></script>
</body>
</html>
