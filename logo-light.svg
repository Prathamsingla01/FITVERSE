<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Vibrant Red-Pink Gradient matching FitVerse aesthetic -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366" />
      <stop offset="100%" stop-color="#cc0033" />
    </linearGradient>
    
    <!-- Clean Silver-White Light Orb Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f0f5" />
    </linearGradient>
    
    <!-- Outer Glow Soft -->
    <filter id="neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Subtle Drop Shadow for Text -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#cc0033" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Orb -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#dropShadow)"/>
  
  <!-- Accent Dash -->
  <rect x="98" y="25" width="4" height="15" rx="2" fill="url(#primaryGrad)" filter="url(#neon)" />

  <g filter="url(#neon)">
      <!-- Central Bar -->
      <rect x="70" y="94" width="60" height="12" fill="url(#primaryGrad)" />
      
      <!-- Left Weights -->
      <rect x="58" y="60" width="12" height="80" rx="3" fill="url(#primaryGrad)" />
      <rect x="43" y="70" width="12" height="60" rx="3" fill="url(#primaryGrad)" />
      <rect x="28" y="80" width="12" height="40" rx="3" fill="url(#primaryGrad)" />

      <!-- Right Weights -->
      <rect x="130" y="60" width="12" height="80" rx="3" fill="url(#primaryGrad)" />
      <rect x="145" y="70" width="12" height="60" rx="3" fill="url(#primaryGrad)" />
      <rect x="160" y="80" width="12" height="40" rx="3" fill="url(#primaryGrad)" />
  </g>

  <!-- Typography -->
  <text x="100" y="165" font-family="'Outfit', 'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="url(#primaryGrad)" text-anchor="middle" letter-spacing="4" filter="url(#dropShadow)">FITVERSE</text>
  
  <!-- Bottom Underline -->
  <rect x="65" y="174" width="70" height="3" rx="1.5" fill="url(#primaryGrad)" filter="url(#neon)" />
</svg>
